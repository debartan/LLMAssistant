[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-server"
version = "0.1.0"
description = "Companion server for the pocket Claude assistant device"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
assistant-server = "assistant_server.main:main"

[tool.setuptools.packages.find]
include = ["assistant_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
